[package]
name = "minuet"
version = "0.1.0"
edition = "2024"
description = "A general-purpose CLI agent harness."
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
# The level-triggered Unix source preserves simultaneous resize and cursor replies.
# Reconsider when the default Mio source drains every readiness notification.
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
rand = "0.9"
# Full-screen scrolling preserves published rows in native scrollback. Partial
# scrolling regions can discard them when appending tool output or run summaries.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
ratatui-textarea = "0.9.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2.0.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2"

[dev-dependencies]
portable-pty = "0.9.0"
tempfile = "3.27.0"
vt100 = "0.16.2"

[target."cfg(unix)".dev-dependencies]
nix = { version = "0.28", features = ["signal"] }
